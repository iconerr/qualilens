#
# The three test commands from the maintenance checklist, on every push.
# No API keys exist here and none are needed: the suite is fully mocked.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Build the interface
        run: cd frontend && npm ci && npm run build
      - name: Build the manual
        run: python3 manual/build_manual.py
      - name: Unit and regression tests
        run: cd backend && python -m pytest tests/test_fixes.py -q
      - name: Grounded theory end to end (mocked)
        run: cd backend && python tests/e2e_grounded_theory.py
      - name: All methods end to end (mocked)
        run: cd backend && python tests/e2e_methods.py
