#
# The three test commands from the maintenance checklist, on every push.
# No API keys exist here and none are needed: the suite is fully mocked.
#
# Each action is pinned to a commit, not a tag: a tag can be moved to other
# code, a commit cannot. The comment names the release the commit was when
# pinned (2026-11-04). The job reads the repository and writes nothing.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the Python CI has always used, and the newest release, which Homebrew
        # and python.org install by default: a pinned package without a wheel
        # for it fails every first launch on such a machine (matplotlib 3.11.1
        # had none for 3.15, found 2026-10-24)
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # an LTS line (20 reached end of life on 2026-04-30); the bundle
          # itself needs no Node, only the repo clone and this build do
          node-version: '24'
      - name: Install backend dependencies (every file checked against its pinned hash)
        run: python -m pip install -r backend/requirements.txt
      - name: Build the interface
        run: cd frontend && npm ci && npm run build
      - name: Build the manual
        run: python3 manual/build_manual.py
      - name: Unit and regression tests
        run: cd backend && python -m pytest tests/test_fixes.py tests/test_hardening.py tests/test_sheets.py tests/test_keystore.py -q
      - name: Grounded theory end to end (mocked)
        run: cd backend && python tests/e2e_grounded_theory.py
      - name: All methods end to end (mocked)
        run: cd backend && python tests/e2e_methods.py
