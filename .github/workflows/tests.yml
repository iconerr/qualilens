#
# The three test commands from the maintenance checklist, on every push.
# No API keys exist here and none are needed: the suite is fully mocked.
#
# Each action is pinned to a commit, not a tag: a tag can be moved to other
# code, a commit cannot. The comment names the release the commit was when
# pinned (2026-10-08). The job reads the repository and writes nothing.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
      - name: Install backend dependencies (every file checked against its pinned hash)
        run: python -m pip install -r backend/requirements.txt
      - name: Build the interface
        run: cd frontend && npm ci && npm run build
      - name: Build the manual
        run: python3 manual/build_manual.py
      - name: Unit and regression tests
        run: cd backend && python -m pytest tests/test_fixes.py tests/test_hardening.py tests/test_sheets.py tests/test_keystore.py -q
      - name: Grounded theory end to end (mocked)
        run: cd backend && python tests/e2e_grounded_theory.py
      - name: All methods end to end (mocked)
        run: cd backend && python tests/e2e_methods.py
